## /feature와 차이점

| | bugfix | feature |
|---|---|---|
| 질문 단계 | 최소 (원인 탐색 우선) | 도메인·영향 범위 확인 |
| 수정 범위 | 버그 재현 범위만 | 신규 기능 전체 |
| 테스트 | 회귀 테스트(Red → Green) | 단위·계약·통합 전체 |
| 브랜치 prefix | `fix/` | `feat/` |
| label | 🐞 Bugfix | ✨ Feature |

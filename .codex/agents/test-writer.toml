## 테스트 유형별 패턴

### 단위 테스트 — Fake 포트 패턴

```kotlin
class AttendanceQueryServiceTest {
    // SpringContext 없음 — Fake 포트로 직접 조립
    private val fakePort = FakeAttendancePersistencePort()
    private val service = AttendanceQueryService(fakePort)

    @Test
    fun `QA 계정은 출석 목록에서 제외된다`() {
        // Arrange
        fakePort.save(attendance(email = "qa@dpm.test"))
        fakePort.save(attendance(email = "user@depromeet.com"))

        // Act
        val result = service.getAttendancesBySession(sessionId = 1L)

        // Assert
        assertThat(result).hasSize(1)
        assertThat(result[0].email).doesNotContain("@dpm.test")
    }
}

// Fake 구현 — 최소한으로 작성
class FakeAttendancePersistencePort : AttendancePersistencePort {
    private val store = mutableListOf<Attendance>()
    override fun save(attendance: Attendance) = attendance.also { store.add(it) }
    override fun findBySessionId(sessionId: Long) = store.filter { it.sessionId == sessionId }
}
```

### 계약 테스트 — 경로·권한·응답 필드

```kotlin
@SpringBootTest
@AutoConfigureMockMvc
class AttendanceApiV3PathContractTest {
    @Test
    fun `GET v3 sessions sessionId attendances — 경로·권한·응답 필드 검증`() {
        mockMvc.get("/v3/sessions/1/attendances") {
            header("Authorization", "Bearer $organizerToken")
        }.andExpect {
            status { isOk() }
            jsonPath("$.data") { isArray() }
            jsonPath("$.data[0].memberId") { exists() }
            jsonPath("$.data[0].status") { exists() }
        }
    }

    @Test
    fun `일반 멤버는 403`() {
        mockMvc.get("/v3/sessions/1/attendances") {
            header("Authorization", "Bearer $deeperToken")
        }.andExpect { status { isForbidden() } }
    }
}
```


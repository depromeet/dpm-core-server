## 다기수 페르소나 케이스 작성 기준

다기수 영향이 있는 테스트라면 아래 페르소나를 케이스로 추가한다 (`.agents/skills/multi-cohort-scenarios/SKILL.md` 참조):

| 페르소나 | 검증 포인트 |
|---|---|
| P-GUEST-OLD | 이전 기수 데이터 접근 불가 |
| P-DEEPER | 본인 데이터만 조회 |
| P-ORGANIZER | 전체 조회 가능, 수정 가능 |
| P-MULTI | activeCohortId 기준으로 권한 판정 |
| P-GUEST-ORG-OLD | 현재 기수 운영 행위 불가 |


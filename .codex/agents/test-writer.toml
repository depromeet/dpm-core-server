## 입력 형식

```
대상: AttendanceQueryService
테스트 유형: 단위
케이스:
  - 세션별 출석 목록 정상 조회
  - QA 계정(@dpm.test)은 결과에서 제외됨
  - P-MULTI 멤버는 activeCohortId 기준으로만 조회됨
  - 출석 없는 세션은 빈 리스트 반환
```


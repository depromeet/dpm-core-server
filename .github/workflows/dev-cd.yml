name: Deploy to Development Server

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-22.04

    steps:
      - name: "레포지토리를 체크아웃한다."
        uses: actions/checkout@v4

      - name: "Gradle Wrapper 무결성을 검증한다."
        uses: gradle/actions/wrapper-validation@v4

      - name: "JDK 21을 설정한다."
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: "Kotlin 소스를 컴파일한다."
        run: ./gradlew compileKotlin --configuration-cache --build-cache

      - name: "Discord로 빌드 실패를 알린다."
        if: failure()
        uses: Ilshidur/action-discord@0.3.2
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          args: |
            ❌ **컴파일 도중 문제가 발생했습니다.**
            actor : `@${{ github.actor }}`
            branch : `${{ github.head_ref }}`
            pull-request : `${{ github.event.pull_request.title }}`
            [🔗 작업 요약 보기](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

  deploy:
    needs:
      - compile
    runs-on: ubuntu-22.04
    env:
      SPRING_PROFILES_ACTIVE: dev
      OCI_OBJECT_STORAGE_BUCKET: ${{ vars.DEV_OCI_OBJECT_STORAGE_BUCKET }}
      OCI_REGION: ${{ vars.DEV_OCI_REGION }}
      OCI_OBJECT_STORAGE_NAMESPACE: ${{ vars.DEV_OCI_OBJECT_STORAGE_NAMESPACE }}
      OCI_AUTH_MODE: instance-principal
      DEPLOY_COMMIT: ${{ github.sha }}
      APP_DIR: /opt/dpm/dev
      HEALTH_URL: http://127.0.0.1:8081/actuator/health
    steps:
      - name: "OCI 설정값을 검증한다."
        run: |
          for v in "$OCI_OBJECT_STORAGE_BUCKET" "$OCI_REGION" "$OCI_OBJECT_STORAGE_NAMESPACE" "$OCI_AUTH_MODE"; do
            case "$v" in ''|*[!A-Za-z0-9._-]*) echo "OCI 저장소 변수(DEV_OCI_*)가 비어 있거나 허용되지 않은 문자를 포함한다"; exit 1;; esac
          done

      - name: "레포지토리를 체크아웃한다."
        uses: actions/checkout@v4

      - name: "JDK 21을 설정한다."
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: "bootJar를 빌드한다."
        run: ./gradlew :application:bootJar --configuration-cache --build-cache

      - name: "JAR를 서버로 전송한다."
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USERNAME }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          source: "application/build/libs/dpm-core-server.jar"
          target: "/tmp/dpm-deploy-dev"
          strip_components: 3
          overwrite: true
          rm: true

      - name: "서버에 배포한다."
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USERNAME }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          command_timeout: 10m
          envs: OCI_OBJECT_STORAGE_BUCKET,OCI_REGION,OCI_OBJECT_STORAGE_NAMESPACE,OCI_AUTH_MODE,DEPLOY_COMMIT,APP_DIR,HEALTH_URL
          script: |
            set -e

            for v in "$OCI_OBJECT_STORAGE_BUCKET" "$OCI_REGION" "$OCI_OBJECT_STORAGE_NAMESPACE" "$OCI_AUTH_MODE"; do
              case "$v" in ''|*[!A-Za-z0-9._-]*) echo "OCI 설정값이 비어 있거나 허용되지 않은 문자를 포함한다"; exit 1;; esac
            done

            JAR_SRC=/tmp/dpm-deploy-dev/dpm-core-server.jar
            test -f "$JAR_SRC" || { echo "업로드된 JAR가 없다: $JAR_SRC"; ls -la /tmp/dpm-deploy-dev || true; exit 1; }
            test -d "$APP_DIR" || { echo "$APP_DIR 가 없다"; exit 1; }

            # /opt/dpm/dev/.env 의 OCI 키만 교체한다 (다른 키·권한 유지)
            (
              set -e
              umask 077
              env_file="$APP_DIR/.env"
              tmp=$(mktemp "$APP_DIR/.env.oci.XXXXXX")
              trap 'rm -f "$tmp"' EXIT
              if [ -f "$env_file" ]; then
                { grep -vE '^(export[[:space:]]+)?OCI_(OBJECT_STORAGE_BUCKET|REGION|OBJECT_STORAGE_NAMESPACE|AUTH_MODE)=' "$env_file" || [ $? -eq 1 ]; } > "$tmp"
              fi
              printf '%s=%s\n' \
                OCI_OBJECT_STORAGE_BUCKET "$OCI_OBJECT_STORAGE_BUCKET" \
                OCI_REGION "$OCI_REGION" \
                OCI_OBJECT_STORAGE_NAMESPACE "$OCI_OBJECT_STORAGE_NAMESPACE" \
                OCI_AUTH_MODE "$OCI_AUTH_MODE" >> "$tmp"
              chown dpm:dpm "$tmp"
              chmod 600 "$tmp"
              mv -f "$tmp" "$env_file"
              trap - EXIT
            )

            systemctl stop dpm@dev
            install -o dpm -g dpm -m 644 "$JAR_SRC" "$APP_DIR/app.jar"
            printf '%s\n' "${DEPLOY_COMMIT:0:8}" > "$APP_DIR/DEPLOYED_COMMIT"
            chown dpm:dpm "$APP_DIR/DEPLOYED_COMMIT"
            rm -rf /tmp/dpm-deploy-dev
            systemctl start dpm@dev

            echo "> dpm@dev 기동 대기"
            for i in $(seq 1 36); do
              if systemctl is-active --quiet dpm@dev \
                && curl -fsS "$HEALTH_URL" >/dev/null 2>&1; then
                echo "> health check OK"
                systemctl status dpm@dev --no-pager -l | head -20
                exit 0
              fi
              sleep 5
            done

            echo "dpm@dev health check 실패"
            systemctl status dpm@dev --no-pager -l | head -40 || true
            journalctl -u dpm@dev -n 80 --no-pager || true
            exit 1

      - name: "Discord로 Development 배포 실패를 알린다."
        if: failure()
        uses: Ilshidur/action-discord@0.3.2
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          args: |
            ❌ **`Development` 배포 도중 문제가 발생했습니다.**
            actor : `@${{ github.actor }}`
            branch : `${{ github.head_ref }}`
            pull-request : `${{ github.event.pull_request.title }}`
            [🔗 작업 요약 보기](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

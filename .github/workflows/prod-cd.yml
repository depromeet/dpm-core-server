name: Deploy to Production Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-22.04

    steps:
      - name: "레포지토리를 체크아웃한다."
        uses: actions/checkout@v4

      - name: "Gradle Wrapper 무결성을 검증한다."
        uses: gradle/actions/wrapper-validation@v4

      - name: "JDK 21을 설정한다."
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: "Kotlin 소스를 컴파일한다."
        run: ./gradlew compileKotlin --configuration-cache --build-cache

      - name: "Discord로 빌드 실패를 알린다."
        if: failure()
        uses: Ilshidur/action-discord@0.3.2
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          args: |
            ❌ **컴파일 도중 문제가 발생했습니다.**
            actor : `@${{ github.actor }}`
            branch : `${{ github.head_ref }}`
            pull-request : `${{ github.event.pull_request.title }}`
            [🔗 작업 요약 보기](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

  deploy:
    needs:
      - compile
    runs-on: ubuntu-22.04
    env:
      SPRING_PROFILES_ACTIVE: prod
      OCI_OBJECT_STORAGE_BUCKET: ${{ vars.PROD_OCI_OBJECT_STORAGE_BUCKET }}
      OCI_REGION: ${{ vars.PROD_OCI_REGION }}
      OCI_OBJECT_STORAGE_NAMESPACE: ${{ vars.PROD_OCI_OBJECT_STORAGE_NAMESPACE }}
      OCI_AUTH_MODE: instance-principal
      DEPLOY_COMMIT: ${{ github.sha }}
      APP_DIR: /opt/dpm/prod
      HEALTH_URL: http://127.0.0.1:8080/actuator/health
    steps:
      - name: "OCI 설정값을 검증한다."
        run: |
          for v in "$OCI_OBJECT_STORAGE_BUCKET" "$OCI_REGION" "$OCI_OBJECT_STORAGE_NAMESPACE" "$OCI_AUTH_MODE"; do
            case "$v" in ''|*[!A-Za-z0-9._-]*) echo "OCI 저장소 변수(PROD_OCI_*)가 비어 있거나 허용되지 않은 문자를 포함한다"; exit 1;; esac
          done

      - name: "레포지토리를 체크아웃한다."
        uses: actions/checkout@v4

      - name: "JDK 21을 설정한다."
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: "bootJar를 빌드한다."
        run: ./gradlew :application:bootJar --configuration-cache --build-cache

      - name: "JAR를 서버로 전송한다."
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USERNAME }}
          key: ${{ secrets.PROD_SERVER_SSH_KEY }}
          source: "application/build/libs/dpm-core-server.jar"
          target: "/tmp/dpm-deploy-prod"
          strip_components: 3
          overwrite: true
          rm: true

      - name: "서버에 배포한다."
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USERNAME }}
          key: ${{ secrets.PROD_SERVER_SSH_KEY }}
          command_timeout: 10m
          envs: OCI_OBJECT_STORAGE_BUCKET,OCI_REGION,OCI_OBJECT_STORAGE_NAMESPACE,OCI_AUTH_MODE,DEPLOY_COMMIT,APP_DIR,HEALTH_URL
          script: |
            set -e

            for v in "$OCI_OBJECT_STORAGE_BUCKET" "$OCI_REGION" "$OCI_OBJECT_STORAGE_NAMESPACE" "$OCI_AUTH_MODE"; do
              case "$v" in ''|*[!A-Za-z0-9._-]*) echo "OCI 설정값이 비어 있거나 허용되지 않은 문자를 포함한다"; exit 1;; esac
            done

            JAR_SRC=/tmp/dpm-deploy-prod/dpm-core-server.jar
            test -f "$JAR_SRC" || { echo "업로드된 JAR가 없다: $JAR_SRC"; ls -la /tmp/dpm-deploy-prod || true; exit 1; }
            test -d "$APP_DIR" || { echo "$APP_DIR 가 없다"; exit 1; }

            # GitHub Secrets가 prod 환경변수 원본 → /opt/dpm/prod/.env 재생성
            umask 077
            tmp=$(mktemp "$APP_DIR/.env.XXXXXX")
            {
              echo "COHORT_VALUE=${{ secrets.PROD_COHORT_VALUE }}"
              echo "SPRING_PROFILES_ACTIVE=prod"
              echo "PROD_DB_HOST=${{ secrets.PROD_DB_HOST }}"
              echo "PROD_DB_PORT=${{ secrets.PROD_DB_PORT }}"
              echo "PROD_DB_SCHEMA=${{ secrets.PROD_DB_SCHEMA }}"
              echo "PROD_DB_USERNAME=${{ secrets.PROD_DB_USERNAME }}"
              echo "PROD_DB_PASSWORD=${{ secrets.PROD_DB_PASSWORD }}"
              echo "KAKAO_CLIENT_ID=${{ secrets.PROD_KAKAO_CLIENT_ID }}"
              echo "KAKAO_CLIENT_SECRET=${{ secrets.PROD_KAKAO_CLIENT_SECRET }}"
              echo "KAKAO_REDIRECT_URI=${{ secrets.PROD_KAKAO_REDIRECT_URI }}"
              echo "JWT_SECRET_KEY=${{ secrets.PROD_JWT_SECRET_KEY }}"
              echo "ACCESS_TOKEN_EXPIRATION_TIME=${{ secrets.PROD_ACCESS_TOKEN_EXPIRATION_TIME }}"
              echo "REFRESH_TOKEN_EXPIRATION_TIME=${{ secrets.PROD_REFRESH_TOKEN_EXPIRATION_TIME }}"
              echo "COOKIE_DOMAIN=${{ secrets.PROD_COOKIE_DOMAIN }}"
              echo "COOKIE_HTTP_ONLY=${{ secrets.PROD_COOKIE_HTTP_ONLY }}"
              echo "COOKIE_SECURE=true"
              echo "REDIRECT_URL=${{ secrets.PROD_REDIRECT_URL }}"
              echo "ADMIN_REDIRECT_URL=${{ secrets.PROD_ADMIN_REDIRECT_URL }}"
              echo "RESTRICTED_REDIRECT_URL=${{ secrets.PROD_RESTRICTED_REDIRECT_URL }}"
              echo "PROD_APPLE_REDIRECT_URI=${{ secrets.PROD_APPLE_REDIRECT_URI }}"
              echo "PROD_APPLE_REDIRECT_URL=${{ secrets.PROD_APPLE_REDIRECT_URL }}"
              echo "PROD_APPLE_PRIVATE_KEY=${{ secrets.PROD_APPLE_PRIVATE_KEY }}"
              echo "PROD_APPLE_TEAM_ID=${{ secrets.PROD_APPLE_TEAM_ID }}"
              echo "PROD_APPLE_KEY_ID=${{ secrets.PROD_APPLE_KEY_ID }}"
              echo "PROD_APPLE_CLIENT_ID=${{ secrets.PROD_APPLE_CLIENT_ID }}"
              echo "SECURITY_LOGGING_LEVEL=${{ secrets.SECURITY_LOGGING_LEVEL }}"
              echo "PROD_DISCORD_WEBHOOK_URL=${{ secrets.PROD_DISCORD_WEBHOOK_URL }}"
              echo "OCI_OBJECT_STORAGE_BUCKET=$OCI_OBJECT_STORAGE_BUCKET"
              echo "OCI_REGION=$OCI_REGION"
              echo "OCI_OBJECT_STORAGE_NAMESPACE=$OCI_OBJECT_STORAGE_NAMESPACE"
              echo "OCI_AUTH_MODE=$OCI_AUTH_MODE"
            } > "$tmp"
            chown dpm:dpm "$tmp"
            chmod 600 "$tmp"
            mv -f "$tmp" "$APP_DIR/.env"

            systemctl stop dpm@prod
            install -o dpm -g dpm -m 644 "$JAR_SRC" "$APP_DIR/app.jar"
            printf '%s\n' "${DEPLOY_COMMIT:0:8}" > "$APP_DIR/DEPLOYED_COMMIT"
            chown dpm:dpm "$APP_DIR/DEPLOYED_COMMIT"
            rm -rf /tmp/dpm-deploy-prod
            systemctl start dpm@prod

            echo "> dpm@prod 기동 대기"
            for i in $(seq 1 36); do
              if systemctl is-active --quiet dpm@prod \
                && curl -fsS "$HEALTH_URL" >/dev/null 2>&1; then
                echo "> health check OK"
                systemctl status dpm@prod --no-pager -l | head -20
                exit 0
              fi
              sleep 5
            done

            echo "dpm@prod health check 실패"
            systemctl status dpm@prod --no-pager -l | head -40 || true
            journalctl -u dpm@prod -n 80 --no-pager || true
            exit 1

      - name: "Discord로 Production 배포 실패를 알린다."
        if: failure()
        uses: Ilshidur/action-discord@0.3.2
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          args: |
            ❌ **`Production` 배포 도중 문제가 발생했습니다.**
            actor : `@${{ github.actor }}`
            branch : `${{ github.head_ref }}`
            pull-request : `${{ github.event.pull_request.title }}`
            [🔗 작업 요약 보기](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

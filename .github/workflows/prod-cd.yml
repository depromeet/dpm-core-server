name: Deploy to Production Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-22.04

    steps:
      - name: "레포지토리를 체크아웃한다."
        uses: actions/checkout@v4

      - name: "Gradle Wrapper 무결성을 검증한다."
        uses: gradle/actions/wrapper-validation@v4

      - name: "JDK 21을 설정한다."
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: "Kotlin 소스를 컴파일한다."
        run: ./gradlew compileKotlin --configuration-cache --build-cache

      - name: "Discord로 빌드 실패를 알린다."
        if: failure()
        uses: Ilshidur/action-discord@0.3.2
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          args: |
            ❌ **컴파일 도중 문제가 발생했습니다.**
            actor : `@${{ github.actor }}`
            branch : `${{ github.head_ref }}`
            pull-request : `${{ github.event.pull_request.title }}`
            [🔗 작업 요약 보기](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

  deploy:
    needs:
      - compile
    runs-on: ubuntu-22.04
    env:
      SPRING_PROFILES_ACTIVE: prod
      OCI_OBJECT_STORAGE_BUCKET: ${{ vars.PROD_OCI_OBJECT_STORAGE_BUCKET }}
      OCI_REGION: ${{ vars.PROD_OCI_REGION }}
      OCI_OBJECT_STORAGE_NAMESPACE: ${{ vars.PROD_OCI_OBJECT_STORAGE_NAMESPACE }}
      OCI_AUTH_MODE: instance-principal
      # 이미지 저장소. PROD_IMAGE_STORAGE_PROVIDER=r2 일 때만 R2 키를 서버 .env 에 반영한다.
      IMAGE_STORAGE_PROVIDER: ${{ vars.PROD_IMAGE_STORAGE_PROVIDER }}
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.PROD_R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.PROD_R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.PROD_R2_SECRET_ACCESS_KEY }}
      DEPLOY_COMMIT: ${{ github.sha }}
      APP_DIR: /opt/dpm/prod
      HEALTH_URL: http://127.0.0.1:8080/actuator/health
    steps:
      - name: "OCI 설정값을 검증한다."
        run: |
          for v in "$OCI_OBJECT_STORAGE_BUCKET" "$OCI_REGION" "$OCI_OBJECT_STORAGE_NAMESPACE" "$OCI_AUTH_MODE"; do
            case "$v" in ''|*[!A-Za-z0-9._-]*) echo "OCI 저장소 변수(PROD_OCI_*)가 비어 있거나 허용되지 않은 문자를 포함한다"; exit 1;; esac
          done

      - name: "R2 설정값을 검증한다."
        if: env.IMAGE_STORAGE_PROVIDER == 'r2'
        run: |
          for v in "$R2_ACCOUNT_ID" "$R2_BUCKET" "$R2_ACCESS_KEY_ID" "$R2_SECRET_ACCESS_KEY"; do
            case "$v" in ''|*[!A-Za-z0-9._-]*) echo "R2 저장소 값(R2_ACCOUNT_ID, PROD_R2_*)이 비어 있거나 허용되지 않은 문자를 포함한다"; exit 1;; esac
          done

      - name: "레포지토리를 체크아웃한다."
        uses: actions/checkout@v4

      - name: "JDK 21을 설정한다."
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: "bootJar를 빌드한다."
        run: ./gradlew :application:bootJar --configuration-cache --build-cache

      # iwinv 단일 호스트에 prod/dev 공존. PROD_SERVER_* 는 이전 서버 키로 남아 인증 실패하므로
      # 갱신된 DEV_SERVER_* SSH 시크릿을 사용한다. (앱 env 는 아래 PROD_* secrets 유지)
      - name: "JAR를 서버로 전송한다."
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USERNAME }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          source: "application/build/libs/dpm-core-server.jar"
          target: "/tmp/dpm-deploy-prod"
          strip_components: 3
          overwrite: true
          rm: true

      - name: "서버에 배포한다."
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USERNAME }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          command_timeout: 10m
          envs: OCI_OBJECT_STORAGE_BUCKET,OCI_REGION,OCI_OBJECT_STORAGE_NAMESPACE,OCI_AUTH_MODE,IMAGE_STORAGE_PROVIDER,R2_ACCOUNT_ID,R2_BUCKET,R2_ACCESS_KEY_ID,R2_SECRET_ACCESS_KEY,DEPLOY_COMMIT,APP_DIR,HEALTH_URL
          script: |
            set -e

            for v in "$OCI_OBJECT_STORAGE_BUCKET" "$OCI_REGION" "$OCI_OBJECT_STORAGE_NAMESPACE" "$OCI_AUTH_MODE"; do
              case "$v" in ''|*[!A-Za-z0-9._-]*) echo "OCI 설정값이 비어 있거나 허용되지 않은 문자를 포함한다"; exit 1;; esac
            done

            JAR_SRC=/tmp/dpm-deploy-prod/dpm-core-server.jar
            test -f "$JAR_SRC" || { echo "업로드된 JAR가 없다: $JAR_SRC"; ls -la /tmp/dpm-deploy-prod || true; exit 1; }
            test -d "$APP_DIR" || { echo "$APP_DIR 가 없다"; exit 1; }
            test -f "$APP_DIR/.env" || { echo "$APP_DIR/.env 가 없다 (서버 상주 env 필요)"; exit 1; }

            # iwinv 이전 후 DB는 로컬 dpm-mysql(dpm_prod). GitHub PROD_DB_* 는 구 RDS(core_prod)라
            # .env 전체를 덮어쓰면 기동 실패한다. Dev와 같이 OCI 키만 갱신한다.
            (
              set -e
              umask 077
              env_file="$APP_DIR/.env"
              tmp=$(mktemp "$APP_DIR/.env.oci.XXXXXX")
              trap 'rm -f "$tmp"' EXIT
              { grep -vE '^(export[[:space:]]+)?OCI_(OBJECT_STORAGE_BUCKET|REGION|OBJECT_STORAGE_NAMESPACE|AUTH_MODE)=' "$env_file" || [ $? -eq 1 ]; } > "$tmp"
              printf '%s=%s\n' \
                OCI_OBJECT_STORAGE_BUCKET "$OCI_OBJECT_STORAGE_BUCKET" \
                OCI_REGION "$OCI_REGION" \
                OCI_OBJECT_STORAGE_NAMESPACE "$OCI_OBJECT_STORAGE_NAMESPACE" \
                OCI_AUTH_MODE "$OCI_AUTH_MODE" >> "$tmp"
              chown dpm:dpm "$tmp"
              chmod 600 "$tmp"
              mv -f "$tmp" "$env_file"
              trap - EXIT
            )

            # PROD_IMAGE_STORAGE_PROVIDER=r2 일 때만 저장소 선택과 R2 키를 GitHub 값으로 교체한다. 비어 있으면 .env 의 기존 값을 그대로 둔다.
            if [ "$IMAGE_STORAGE_PROVIDER" = "r2" ]; then
              for v in "$R2_ACCOUNT_ID" "$R2_BUCKET" "$R2_ACCESS_KEY_ID" "$R2_SECRET_ACCESS_KEY"; do
                case "$v" in ''|*[!A-Za-z0-9._-]*) echo "R2 설정값이 비어 있거나 허용되지 않은 문자를 포함한다"; exit 1;; esac
              done
              (
                set -e
                umask 077
                env_file="$APP_DIR/.env"
                tmp=$(mktemp "$APP_DIR/.env.r2.XXXXXX")
                trap 'rm -f "$tmp"' EXIT
                { grep -vE '^(export[[:space:]]+)?(IMAGE_STORAGE_PROVIDER|R2_(ACCOUNT_ID|BUCKET|ACCESS_KEY_ID|SECRET_ACCESS_KEY))=' "$env_file" || [ $? -eq 1 ]; } > "$tmp"
                printf '%s=%s\n' \
                  IMAGE_STORAGE_PROVIDER r2 \
                  R2_ACCOUNT_ID "$R2_ACCOUNT_ID" \
                  R2_BUCKET "$R2_BUCKET" \
                  R2_ACCESS_KEY_ID "$R2_ACCESS_KEY_ID" \
                  R2_SECRET_ACCESS_KEY "$R2_SECRET_ACCESS_KEY" >> "$tmp"
                chown dpm:dpm "$tmp"
                chmod 600 "$tmp"
                mv -f "$tmp" "$env_file"
                trap - EXIT
              )
            fi

            systemctl stop dpm@prod
            install -o dpm -g dpm -m 644 "$JAR_SRC" "$APP_DIR/app.jar"
            printf '%s\n' "${DEPLOY_COMMIT:0:8}" > "$APP_DIR/DEPLOYED_COMMIT"
            chown dpm:dpm "$APP_DIR/DEPLOYED_COMMIT"
            rm -rf /tmp/dpm-deploy-prod
            systemctl start dpm@prod

            echo "> dpm@prod 기동 대기"
            for i in $(seq 1 36); do
              if systemctl is-active --quiet dpm@prod \
                && curl -fsS "$HEALTH_URL" >/dev/null 2>&1; then
                echo "> health check OK"
                systemctl status dpm@prod --no-pager -l | head -20 || true
                exit 0
              fi
              echo "  waiting... ($i/36)"
              sleep 5
            done

            echo "dpm@prod health check 실패"
            systemctl status dpm@prod --no-pager -l | head -40 || true
            journalctl -u dpm@prod -n 80 --no-pager || true
            exit 1

      - name: "Discord로 Production 배포 실패를 알린다."
        if: failure()
        uses: Ilshidur/action-discord@0.3.2
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          args: |
            ❌ **`Production` 배포 도중 문제가 발생했습니다.**
            actor : `@${{ github.actor }}`
            branch : `${{ github.head_ref }}`
            pull-request : `${{ github.event.pull_request.title }}`
            [🔗 작업 요약 보기](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

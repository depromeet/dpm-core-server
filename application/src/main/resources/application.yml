spring:
  config:
    import: optional:file:.env[.properties]
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        show_sql: true
        use_sql_comments: true

  jooq:
    sql-dialect: mysql

  security:
    jwt:
      secret_key: ${JWT_SECRET_KEY}
      expiration-time:
        access-token: ${ACCESS_TOKEN_EXPIRATION_TIME}
        refresh-token: ${REFRESH_TOKEN_EXPIRATION_TIME}

    logout-url: ${LOGOUT_URL:/logout}

    cookie:
      domain: ${COOKIE_DOMAIN:localhost}
      secure: ${COOKIE_SECURE:true}
      http-only: ${COOKIE_HTTP_ONLY:false}

    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            redirect-uri: ${KAKAO_REDIRECT_URI}
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - account_email
              - profile_nickname
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id


management:
  endpoints:
    web:
      exposure:
        include: health
      base-path: /actuator
    access:
      default: none
  endpoint:
    health:
      access: read_only
logging:
  level:
    org.jooq.tools.LoggerListener: DEBUG
    org.springframework.security: ${SECURITY_LOGGING_LEVEL:DEBUG}
  # ERROR 로그 Discord 알림. webhook-url 은 프로필별 설정에서 주입한다.
  discord:
    app-name: dpm-core-server
    # 같은 에러를 다시 알리기까지의 최소 간격
    cooldown-seconds: 300
    max-per-minute: 20
    # 스택트레이스에서 남길 프레임의 패키지. 나머지는 줄 수만 세어 접는다.
    include-packages: core.,com.server.dpmcore.
    # 위 패키지에 해당하는 프레임을 최대 몇 줄까지 남길지
    stack-trace-lines: 12
    queue-size: 512
    connect-timeout-millis: 2000
    read-timeout-millis: 3000
    # 알림 가치가 없는 프레임워크 예외들. 코드 수정 없이 여기서 끌 수 있다.
    excluded-exceptions: >-
      org.springframework.web.HttpRequestMethodNotSupportedException,
      org.springframework.web.servlet.resource.NoResourceFoundException,
      org.apache.catalina.connector.ClientAbortException
    excluded-loggers: ""


session:
  attendance:
    start-hour: ${SESSION_ATTENDANCE_START_HOUR:14}

attendance:
  # 출석 시각을 모두 생략한 세션 생성에만 쓰는 기본값(분). 바꿔도 이미 만든 세션은 그대로다.
  policy:
    open-minutes-before-start: ${ATTENDANCE_OPEN_MINUTES_BEFORE_START:10}
    late-after-start-minutes: ${ATTENDANCE_LATE_AFTER_START_MINUTES:15}
    absent-after-start-minutes: ${ATTENDANCE_ABSENT_AFTER_START_MINUTES:30}
member:
  default-team-id: ${DEFAULT_TEAM_ID:0}
image:
  # OCI Object Storage (비공개 버킷). 값이 비어도 기동은 되고 이미지 API 만 503 이 된다.
  storage:
    auth-mode: ${OCI_AUTH_MODE:instance-principal}
    region: ${OCI_REGION:}
    namespace: ${OCI_OBJECT_STORAGE_NAMESPACE:}
    bucket: ${OCI_OBJECT_STORAGE_BUCKET:}
    # auth-mode=config-file 일 때만 쓴다 (로컬 개발)
    config-file-path: ${OCI_CONFIG_FILE:}
    config-profile: ${OCI_CONFIG_PROFILE:DEFAULT}
cors:
  allowed-origins:
    # Frontend origins
    - https://localhost:3000
    - https://local.depromeet.shop
    - https://local-core.depromeet.shop:3010
    - https://local-admin.depromeet.shop:3020
    - https://local-core.depromeet.com:3010
    - https://local-admin.depromeet.com:3020
    - https://dev.depromeet.com
    - https://dev-admin.depromeet.com
    - https://core.depromeet.com
    - https://admin.depromeet.com
    - https://api.depromeet.com
    # OAuth2 provider origins (required for OAuth2 callbacks)
    - https://appleid.apple.com
    - https://kauth.kakao.com
server:
  forward-headers-strategy: framework
